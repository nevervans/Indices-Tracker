name: Update indices tracker

on:
  schedule:
    # Fridays 17:00 IST (11:30 UTC), after market close - adjust as you like
    - cron: "30 11 * * 5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh cached history (only pulls new dates after the first run)
        run: python refresh_history.py --config indices_config.csv

      - name: Build the standard Tracker sheet from the cache
        run: python query_returns.py --all --output tracker_auto.xlsx

      - name: Append fresh NAVs into CA_Equity_Markets_Tracker.xlsx (Sheet1 only - formulas untouched)
        run: |
          python export_to_tracker.py \
            --config indices_config.csv \
            --tracker CA_Equity_Markets_Tracker.xlsx \
            --output CA_Equity_Markets_Tracker.xlsx

      - name: Commit updated history + trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ tracker_auto.xlsx CA_Equity_Markets_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Weekly indices update $(date +'%Y-%m-%d')"
          git push

      - name: Also upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trackers
          path: |
            tracker_auto.xlsx
            CA_Equity_Markets_Tracker.xlsx