name: Update indices tracker

on:
  schedule:
    - cron: '30 3 * * 0'   # Sunday 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh cached history (only pulls new dates after the first run)
        run: python refresh_history.py --config indices_config.csv

      - name: Build the standard Tracker sheet from the cache
        run: python query_returns.py --all --output tracker_auto.xlsx

      - name: Rebuild CA_Equity_Markets_Tracker.xlsx fresh (formulas always come from the untouched
          pristine template, never from last week's output - a binary .xlsx that both this Action
          and a person can edit is exactly what corrupted the file once already)
        run: |
          python build_tracker.py \
            --config indices_config.csv \
            --old-tracker tracker_template_PRISTINE_DO_NOT_EDIT.xlsx \
            --output CA_Equity_Markets_Tracker.xlsx

      - name: Commit updated history + trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ tracker_auto.xlsx CA_Equity_Markets_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Weekly indices update $(date +'%Y-%m-%d')"
          git push

      - name: Also upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trackers
          path: |
            tracker_auto.xlsx
            CA_Equity_Markets_Tracker.xlsx